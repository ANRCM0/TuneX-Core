name: VNext contract baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vnext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            agent/.cache/go-mod
            agent/.cache/go-build
          key: vnext-go-${{ runner.os }}-${{ hashFiles('agent/go.sum') }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node scripts/run-go.mjs vet ./...
      - run: node scripts/run-go.mjs test -race ./...

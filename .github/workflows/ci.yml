name: VNext contract baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vnext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify local certificate fixture tooling
        run: openssl version
      - name: Role-specific deployment preflight regression
        run: node --test deploy/test/preflight*.test.mjs
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            agent/.cache/go-mod
            agent/.cache/go-build
          key: vnext-go-${{ runner.os }}-${{ hashFiles('agent/go.sum') }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: dependencies
      - name: Public foundation extension preview through declared interfaces
        run: node examples/foundation-extension/main.ts
      - name: Native execution registry and host authorization contracts
        run: node scripts/run-go.mjs test ./internal/control -run '^TestExecution' -count=1
      - name: Control query and Transport resolution port regressions
        run: node --test apps/control/test/application-query-ports.test.ts apps/control/test/console-read.test.ts apps/control/test/console-diagnostics.test.ts apps/control/test/transport-query-ports.test.ts apps/control/test/multihop-coordinator.test.ts
      - name: Bounded native TLS metadata and desired adjacency read ports
        run: node --test apps/control/test/tunnel-query-ports.test.ts
      - name: Immutable native PathTemplate authoring, scope CAS, quota and original reference ports
        run: node --test apps/control/test/path-template-ports.test.ts
      - name: Exact native path bindings share original Forward acceptance and retain immutable provenance
        run: node --test apps/control/test/path-binding-ports.test.ts
      - name: Owner-owned Profile commands and Runtime grant effects
        run: node --test apps/control/test/transport-grant-ports.test.ts
      - name: Owner-owned member and Node Grant command ports
        run: node --test apps/control/test/access-command-ports.test.ts
      - name: Whole-Node policy and credential revocation command ports
        run: node --test apps/control/test/node-management-ports.test.ts
      - name: Forward command acceptance and native preparation ports
        run: node --test apps/control/test/forward-command-ports.test.ts
      - name: Static Snapshot sources, ownership and complete-merge contracts
        run: node --test apps/control/test/snapshot-assignment-ports.test.ts
      - name: Authorized passive observations, deadlines and admission budgets
        run: node --test apps/control/test/node-observation-ports.test.ts
      - name: Non-executable Forward probe preflight contracts
        run: node --test apps/control/test/forward-probe-plan-ports.test.ts
      - name: Independent Probe negotiation schemas and read-only machine ports
        run: |
          node --test packages/contracts/test/probe-negotiation.test.ts apps/control/test/probe-negotiation-ports.test.ts
          node scripts/run-go.mjs test ./internal/probenegotiation -count=1
      - name: Non-executable durable Probe instance ownership and generation CAS
        run: node --test apps/control/test/probe-instance-ports.test.ts apps/control/test/upgrade-assessment.test.ts
      - name: Remote Probe instance contract and registry authorization
        run: |
          node --test packages/contracts/test/probe-instance.test.ts apps/control/test/probe-instance-registry.test.ts
          node scripts/run-go.mjs test ./internal/probeinstance -count=1
      - name: Internal Probe permit authority, bounded delivery, consumed checks and sticky withdrawals
        run: node --test apps/control/test/probe-permit-ports.test.ts
      - name: Non-executable remote Probe claims, closed receipts and host verification
        run: |
          node --test packages/contracts/test/probe-claim.test.ts apps/control/test/probe-claims.test.ts
          node scripts/run-go.mjs test ./internal/probeclaim -count=1
      - name: Bounded Probe delivery and point-in-time status contracts
        run: |
          node --test packages/contracts/test/probe-delivery.test.ts apps/control/test/probe-delivery.test.ts
          node scripts/run-go.mjs test ./internal/probedelivery -count=1
      - name: Agent bounded Probe exchange and fail-closed consumed-authority monitor
        run: node scripts/run-go.mjs test ./internal/control -run '^TestProbeDelivery' -count=1
      - name: Short-lived Agent-reported Probe result contracts and committed receipts
        run: |
          node --test packages/contracts/test/probe-result.test.ts apps/control/test/probe-results.test.ts
          node scripts/run-go.mjs test ./internal/proberesult -count=1
      - name: One-use host Probe execution, live authority and conservative result serialization
        run: node scripts/run-go.mjs test ./internal/control -run '^TestProbeExecution' -count=1
      - name: Opt-in Probe manager acceptance, HTTP routes and Agent serial workflow
        run: |
          node --test apps/control/test/forward-probes-api.test.ts apps/control/test/probe-permit-ports.test.ts
          node scripts/run-go.mjs test ./internal/control -run '^TestProbeWorkflow' -count=1
      - name: Independently authorized Agent connect-only probe and live host bindings
        run: |
          node scripts/run-go.mjs test ./internal/probe ./internal/egress -count=1
          node scripts/run-go.mjs test ./internal/control -run '^TestProbe' -count=1
      - name: Collect every independent candidate check group
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          result=0
          for task in typecheck test test:web test:udp-smoke test:go build:go contracts:check test:boundaries; do
            echo "::group::$task"
            npm run "$task" || result=1
            echo "::endgroup::"
          done
          node scripts/verify-offline-plan.mjs || result=1
          exit "$result"
      - run: node scripts/run-go.mjs vet ./...
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: node scripts/run-go.mjs test -race ./...
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            agent/.cache/go-mod
            agent/.cache/go-build
          key: vnext-go-windows-amd64-${{ hashFiles('agent/go.sum') }}
      - name: Native Windows Agent contracts and filesystem lifecycle
        run: node scripts/run-go.mjs test ./... -count=1
      - name: Windows Agent build
        if: ${{ !cancelled() }}
        run: node scripts/run-go.mjs build ./...
      - name: Windows Agent vet
        if: ${{ !cancelled() }}
        run: node scripts/run-go.mjs vet ./...
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: tunex_phase1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TUNEX_TEST_DATABASE_URL: mysql://root:ci-disposable-only@127.0.0.1:3306/tunex_phase1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: mkdir -p .artifacts
      - run: node scripts/run-go.mjs build -o ../.artifacts/tunex-agent ./cmd/tunex-agent
      - name: Verify actual OS time synchronization before granting Agent leases
        run: node scripts/run-go.mjs run ./cmd/time-proof --check
      - run: node scripts/run-go.mjs build -o ../.artifacts/time-proof ./cmd/time-proof
      - run: node scripts/run-go.mjs build -o ../.artifacts/network-fixture ./cmd/network-fixture
      - name: Transit real MySQL transaction acceptance
        run: node --test apps/control/test/transit-mysql-acceptance.test.ts
      - name: Transit offline coordination MySQL acceptance
        run: node --test apps/control/test/transit-coordination.test.ts
      - name: Transit mTLS capability negotiation MySQL acceptance
        run: node --test apps/control/test/transit-negotiation.test.ts
      - name: Multi-hop withdrawal, command/Snapshot rollback and full-path capacity
        run: node --test apps/control/test/multihop-runtime.test.ts
      - name: Relay operation predicates and rollback before deployment withdrawal
        run: node --test apps/control/test/relay-owner-complete.test.ts
      - name: Original Ledger retirement, rollback and competing claim locks
        run: node --test apps/control/test/ledger-owner-complete.test.ts
      - name: Original resource reservation rollback and physical slot predicates
        run: node --test apps/control/test/resource-sql-complete.test.ts
      - name: Original MySQL migration lock, partial DDL and uncertain commit outcomes
        run: node --test apps/control/test/mysql-native-complete.test.ts
      - name: Original observation and publication recovery SQL retention and rollback
        run: node --test apps/control/test/observation-recovery-stores-complete.test.ts apps/control/test/publication-recovery-stores-complete.test.ts
      - name: Original Transport, Transit and Path metadata statement faults and canonical rollback
        run: node --test apps/control/test/transport-store-sql-complete.test.ts apps/control/test/transit-store-sql-complete.test.ts apps/control/test/transit-negotiation-sql-complete.test.ts apps/control/test/path-template-store-sql-complete.test.ts
      - name: Original notification native quotas, retention, compare-and-set and statement rollback
        run: node --test apps/control/test/notification-native-complete.test.ts
      - name: Original Audit attribution, Station retention and immutable PathGroup transaction closure
        run: node --test apps/control/test/audit-store-complete.test.ts apps/control/test/audit-attribution-native-complete.test.ts apps/control/test/station-storage-complete.test.ts apps/control/test/path-group-store-sql-complete.test.ts
      - name: Original Publication, IngressGroup, ObservationService and ProbeRegistry transactions
        run: node --test apps/control/test/path-publication-store-sql-complete.test.ts apps/control/test/ingress-group-storage-complete.test.ts apps/control/test/observation-service-store-complete.test.ts apps/control/test/probe-registry-store-complete.test.ts
      - name: Original Ingress Deployment and Migration same-transaction Forward statement rollback
        run: node --test apps/control/test/ingress-batch-mysql-acceptance.test.ts
      - name: Original Node and Identity native authority and SQL rollback
        run: node --test apps/control/test/node-owner-complete.test.ts apps/control/test/node-store-sql-complete.test.ts apps/control/test/identity-owner-complete.test.ts apps/control/test/identity-store-sql-complete.test.ts
      - name: Probe history native family projection and MySQL0037 immutable capture
        run: node --test apps/control/test/probe-history-complete.test.ts
      - name: Original Probe history and finite plans same-transaction statement rollback and scheduler contention
        run: node --test apps/control/test/probe-history-plan-native-complete.test.ts
      - name: Original Telemetry raw and rollup same-transaction quotas pruning and statement rollback
        run: node --test apps/control/test/telemetry-store-complete.test.ts
      - name: Read-only upgrade assessment with SELECT-only MySQL and authenticated Agent journal
        run: node --test apps/control/test/upgrade-mysql-acceptance.test.ts
      - name: Console scoped filters, independent candidates and full-scope overview with SELECT-only MySQL
        run: node --test apps/control/test/console-mysql-acceptance.test.ts
      - name: Native capability declarations and immutable Profile reference impact with SELECT-only MySQL
        run: node --test apps/control/test/transport-query-mysql-acceptance.test.ts
      - name: Native TLS metadata, exact scoped adjacency and no writes with SELECT-only MySQL
        run: node --test apps/control/test/tunnel-query-mysql-acceptance.test.ts
      - name: PathTemplate native grants, concurrent CAS and quota, archive and SELECT-only history
        run: node --test apps/control/test/path-template-mysql-acceptance.test.ts
      - name: Original Forward path bindings, concurrent CAS, provenance quota rollback and SELECT-only impact
        run: node --test apps/control/test/path-binding-mysql-acceptance.test.ts
      - name: Original Path binding SQL and coordination journal native transaction rollback
        run: node --test apps/control/test/path-binding-store-sql-complete.test.ts apps/control/test/transit-coordination-store-complete.test.ts apps/control/test/transit-delivery-store-complete.test.ts
      - name: Passive observation API with SELECT-only MySQL and scoped provenance
        run: node --test apps/control/test/node-observation-mysql-acceptance.test.ts
      - name: Non-executable probe preflight with SELECT-only MySQL and current binding checks
        run: node --test apps/control/test/forward-probe-mysql-acceptance.test.ts
      - name: Probe permit owner transactions, bounded offers, consumed withdrawal and upgrade backfill
        run: node --test apps/control/test/probe-permit-mysql-acceptance.test.ts
      - name: Probe registry, claims, bounded delivery and result ingestion over real mTLS
        run: node --test apps/control/test/probe-negotiation-mysql-acceptance.test.ts
      - name: Probe instance persistence, concurrent replacement, rollback and recovery quarantine
        run: node --test apps/control/test/probe-instance-mysql-acceptance.test.ts
      - run: npm run test:phase1
      - run: npm run test:phase2
      - run: npm run test:security
      - run: npm run test:faults
      - run: npm run test:access
      - run: npm run test:transport
      - run: npm run test:relay-agent
      - run: npm run test:relay
      - run: npm run test:relay-switch
      - name: Use backup clients inside the locked MySQL service image
        run: |
          mkdir -p .artifacts/mysql-clients
          cat > .artifacts/mysql-clients/mysql <<'SH'
          #!/bin/sh
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" --env MYSQL_PWD --volume "$PWD:$PWD" --workdir "$PWD" --entrypoint /usr/bin/mysql mysql:8.4.9 "$@"
          SH
          cat > .artifacts/mysql-clients/mysqldump <<'SH'
          #!/bin/sh
          exec docker run --rm --network host --user "$(id -u):$(id -g)" --env MYSQL_PWD --volume "$PWD:$PWD" --workdir "$PWD" --entrypoint /usr/bin/mysqldump mysql:8.4.9 "$@"
          SH
          chmod 700 .artifacts/mysql-clients/mysql .artifacts/mysql-clients/mysqldump
          .artifacts/mysql-clients/mysql --version
          .artifacts/mysql-clients/mysqldump --version
      - run: npm run test:recovery
        env:
          TUNEX_MYSQL: .artifacts/mysql-clients/mysql
          TUNEX_MYSQLDUMP: .artifacts/mysql-clients/mysqldump
      - run: npm run test:capacity
      - name: Preserve redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-acceptance
          path: |
            .artifacts/phase1/**/evidence.json
            .artifacts/phase2/**/evidence.json
            .artifacts/security/**/evidence.json
            .artifacts/faults/**/evidence.json
            .artifacts/access/**/evidence.json
            .artifacts/transport/**/evidence.json
            .artifacts/linux-agent/**/evidence.json
            .artifacts/relay/**/evidence.json
            .artifacts/recovery/**/evidence.json
            .artifacts/capacity/**/evidence.json
            .artifacts/capacity/**/failure.json
  probe-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: tunex_probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TUNEX_TEST_DATABASE_URL: mysql://root:ci-disposable-only@127.0.0.1:3306/tunex_probe
      TUNEX_PROBE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: mkdir -p .artifacts
      - run: node scripts/run-go.mjs build -o ../.artifacts/tunex-agent ./cmd/tunex-agent
      - name: Verify independent native Linux OS clock synchronization
        run: node scripts/run-go.mjs run ./cmd/time-proof --check
      - run: node scripts/run-go.mjs build -o ../.artifacts/time-proof ./cmd/time-proof
      - run: node scripts/run-go.mjs build -o ../.artifacts/network-fixture ./cmd/network-fixture
      - name: Install Chromium only on the disposable browser acceptance runner
        run: npx playwright install --with-deps chromium
      - name: Real default-off Probe, native rule Console/CAS/retry, Agent lifecycle, mTLS, MySQL and bounded TCP fixtures
        run: npm run test:probe
      - name: Real Relay TLS metadata, Profile batches with CAS and lost-response replay, copy and TCP/UDP through Chromium
        run: npm run test:relay
        env:
          TUNEX_TUNNEL_BROWSER: '1'
      - name: Preserve only redacted Console evidence, never test PKI or protected Agent state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-workflow-acceptance
          path: |
            .artifacts/probe/**/evidence.json
            .artifacts/probe/**/console-probe-*.png
            .artifacts/relay/**/evidence.json
            .artifacts/relay/**/console-tunnel-*.png
  multihop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        nodes: [3, 4, 8]
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: tunex_multihop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TUNEX_TEST_DATABASE_URL: mysql://root:ci-disposable-only@127.0.0.1:3306/tunex_multihop
      TUNEX_MULTIHOP_NODES: ${{ matrix.nodes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install tools on the disposable acceptance runner
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables util-linux
      - run: mkdir -p .artifacts
      - run: node scripts/run-go.mjs build -o ../.artifacts/tunex-agent ./cmd/tunex-agent
      - run: node scripts/run-go.mjs build -o ../.artifacts/time-proof ./cmd/time-proof
      - run: node scripts/run-go.mjs build -o ../.artifacts/network-fixture ./cmd/network-fixture
      - name: Install Chromium only on the disposable multi-hop acceptance runner
        run: npx playwright install --with-deps chromium
      - name: Real Control, 3/4/8 Agent lifecycle, ordered Console copy and immutable path metadata through Chromium
        run: npm run test:multihop
        env:
          TUNEX_MULTIHOP_BROWSER: '1'
      - name: Interior partition, latency and loss in owned network namespaces
        run: npm run test:multihop -- --isolated
      - name: Preserve evidence without enrollment or private key material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multihop-${{ matrix.nodes }}-node-acceptance
          path: |
            .artifacts/multihop/**/evidence.json
            .artifacts/multihop/**/failure.json
            .artifacts/multihop/**/console-multihop-*.png
  relay-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: tunex_phase1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TUNEX_TEST_DATABASE_URL: mysql://root:ci-disposable-only@127.0.0.1:3306/tunex_phase1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install namespace tools on this disposable runner
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables util-linux
      - name: Verify network tooling resolves on PATH
        run: command -v ip && command -v ss && ss -V
      - run: mkdir -p .artifacts
      - run: node scripts/run-go.mjs build -o ../.artifacts/tunex-agent ./cmd/tunex-agent
      - run: node scripts/run-go.mjs build -o ../.artifacts/time-proof ./cmd/time-proof
      - run: node scripts/run-go.mjs build -o ../.artifacts/network-fixture ./cmd/network-fixture
      - run: npm run test:relay-isolation
      - run: npm run test:relay-capacity
      - run: npm run test:relay-rotation
      - name: Preserve isolated-network acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-isolation-acceptance
          path: |
            .artifacts/relay-isolation/**/evidence.json
            .artifacts/relay-isolation/**/failure.json
            .artifacts/relay-capacity/**/evidence.json
            .artifacts/relay-capacity/**/failure.json
            .artifacts/relay-rotation/**/evidence.json
            .artifacts/relay-rotation/**/failure.json

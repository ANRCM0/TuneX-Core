name: VNext container packaging
on:
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "apps/control/**"
      - "apps/web/**"
      - "packages/**"
      - "agent/**"
      - "package*.json"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "apps/control/**"
      - "apps/web/**"
      - "packages/**"
      - "agent/**"
      - "package*.json"
      - ".github/workflows/container.yml"
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify liveness and protected deployment preflight
        run: node --test deploy/test/*.test.mjs
      - name: Build VNext Control image
        run: docker build --pull --build-arg TUNEX_SOURCE_REVISION="$GITHUB_SHA" -f deploy/Dockerfile.control -t tunex-control:ci .
      - name: Confirm Control runs as non-root and uses Node
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' tunex-control:ci)" = "10001:10001"
          docker run --rm --entrypoint node tunex-control:ci --version
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' tunex-control:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect -f '{{json .Config.Healthcheck.Test}}' tunex-control:ci)" != 'null'
      - name: Verify Control refuses startup without mounted trust and database
        run: |
          if docker run --rm tunex-control:ci; then
            echo "Unsafe Control startup without configured authority" >&2
            exit 1
          fi
      - name: Build VNext Agent image
        run: docker build --pull --build-arg TUNEX_SOURCE_REVISION="$GITHUB_SHA" -f deploy/Dockerfile.agent -t tunex-agent:ci .
      - name: Confirm Agent runs as non-root and binary starts
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' tunex-agent:ci)" = "10001:10001"
          docker run --rm tunex-agent:ci --help
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' tunex-agent:ci)" = "$GITHUB_SHA"
      - name: Verify Agent refuses startup without protected identity and journal
        run: |
          if docker run --rm tunex-agent:ci --control=https://127.0.0.1:41001 --node=test --ca=/missing-ca.pem --state=/var/lib/tunex-agent --journal-key=/run/tunex-agent-secrets/missing.key; then
            echo "Unsafe Agent startup without protected identity" >&2
            exit 1
          fi
      - name: Report local image identifiers (not immutable registry digests)
        run: |
          docker image inspect --format 'Control local image ID: {{.Id}}' tunex-control:ci
          docker image inspect --format 'Agent local image ID: {{.Id}}' tunex-agent:ci
      - name: Generate image SBOMs for review
        uses: anchore/sbom-action@v0.20.7
        with:
          image: tunex-control:ci
          artifact-name: tunex-control-sbom.spdx.json
          output-file: /tmp/tunex-control-sbom.spdx.json
      - name: Generate Agent image SBOM
        uses: anchore/sbom-action@v0.20.7
        with:
          image: tunex-agent:ci
          artifact-name: tunex-agent-sbom.spdx.json
          output-file: /tmp/tunex-agent-sbom.spdx.json
      - name: Scan Control image for vulnerabilities (advisory report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tunex-control:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: control-trivy.json
          exit-code: '0'
      - name: Scan Agent image for vulnerabilities (advisory report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tunex-agent:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: agent-trivy.json
          exit-code: '0'
      - name: Validate both scanner reports were actually produced
        run: |
          node -e "for(const p of ['control-trivy.json','agent-trivy.json']){const v=require('./'+p);if(!Array.isArray(v.Results))throw Error('Missing scanner results '+p)}"
      - name: Preserve scan reports for security review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunex-vnext-vulnerability-reports
          if-no-files-found: warn
          path: |
            control-trivy.json
            agent-trivy.json
      - name: Validate runtime Compose without mounting real secrets
        env:
          TUNEX_CONTROL_IMAGE: tunex-control:ci
          TUNEX_AGENT_IMAGE: tunex-agent:ci
          TUNEX_DATABASE_URL: mysql://test:test@127.0.0.1:3306/tunex
          TUNEX_CONTROL_STATE_DIR: /tmp/disposable-control-state
          TUNEX_CONTROL_PKI_DIR: /tmp/disposable-control-pki
          TUNEX_CONTROL_URL: https://localhost:41001
          TUNEX_NODE_ID: disposable-node
          TUNEX_AGENT_STATE_DIR: /tmp/disposable-agent-state
          TUNEX_AGENT_SECRETS_DIR: /tmp/disposable-agent-secrets
        run: docker compose -f deploy/compose.runtime.example.yaml --profile agent config --quiet
